<!doctype html>
<html lang="tr">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>WAG1 / Admin</title>
  <style>
    :root{color-scheme:dark;--bg:#050505;--panel:#0c0c0c;--panel2:#101010;--line:#232323;--gold:#f7b718;--text:#fff;--muted:#8d8d8d;--green:#72e1a2;--red:#ef6262}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,rgba(247,183,24,.11),transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}body{padding:18px}button,input{font:inherit}button{cursor:pointer}
    .wrap{width:min(1120px,100%);margin:0 auto}.eyebrow{margin:0 0 8px;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.24em}.muted{color:var(--muted)}h1{margin:0;letter-spacing:-.045em;line-height:1.02;font-size:clamp(32px,5vw,54px)}
    .panel{background:rgba(12,12,12,.96);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.28)}.login{width:min(520px,100%);margin:7vh auto 0;padding:28px}.login .muted{margin:12px 0 24px}.field{display:block;margin:0 0 16px}.field span{display:block;margin:0 0 7px;font-size:10px;font-weight:900;letter-spacing:.14em}.field input{width:100%;padding:14px 15px;color:#fff;background:#090909;border:1px solid #2b2b2b;border-radius:13px;outline:none;transition:border-color .16s,box-shadow .16s}.field input:focus{border-color:rgba(247,183,24,.72);box-shadow:0 0 0 3px rgba(247,183,24,.08)}
    .btn{border:1px solid transparent;border-radius:12px;padding:12px 15px;font-size:12px;font-weight:900;letter-spacing:.07em;transition:transform .12s,opacity .12s,background .12s}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.56;cursor:wait}.primary{width:100%;background:linear-gradient(135deg,#ffd45d,#f5b212);color:#0d0d0d}.ghost{background:#111;border-color:#2b2b2b;color:#fff}.danger{background:rgba(239,98,98,.08);border-color:rgba(239,98,98,.25);color:#ff9f9f}.status{min-height:22px;margin:12px 0 0;font-size:13px;color:var(--muted)}.status.ok{color:var(--green)}.status.err{color:#ff8f8f}
    .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:10px 2px 20px}.title-wrap .muted{margin:9px 0 0}.actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#090909}.stat-label{font-size:10px;font-weight:900;letter-spacing:.14em;color:#777}.stat-value{margin-top:6px;font-size:28px;font-weight:900;letter-spacing:-.04em}.list{display:grid;gap:10px}.item{padding:17px 18px;border:1px solid var(--line);border-radius:17px;background:var(--panel2)}.item.read{opacity:.72}.item-top{display:flex;justify-content:space-between;gap:14px;align-items:center}.left-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.class{color:var(--gold);font-size:12px;font-weight:900}.time{font-size:11px;color:#666}.pill{font-size:10px;font-weight:900;letter-spacing:.05em;padding:5px 8px;border-radius:999px;border:1px solid #333;color:#aaa}.pill.new{border-color:rgba(247,183,24,.3);color:var(--gold)}.pill.read{border-color:rgba(114,225,162,.25);color:var(--green)}.message{margin:11px 0 15px;white-space:pre-wrap;line-height:1.55;font-size:14px;color:#ededed}.item-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:28px;border:1px dashed #2a2a2a;border-radius:16px;color:#aaa;text-align:center;background:#090909}.loading{padding:26px;border:1px solid var(--line);border-radius:16px;background:#090909;color:#999;text-align:center}
    .hidden{display:none!important}
    @media(max-width:720px){body{padding:12px}.login{margin-top:4vh;padding:20px;border-radius:18px}.topbar{align-items:flex-start;flex-direction:column;padding-top:4px}.actions{width:100%}.actions .btn{flex:1}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.item-top{align-items:flex-start;flex-direction:column}.time{align-self:flex-start}.item{padding:15px}.item-actions .btn{flex:1;min-width:120px}}
  </style>
</head>
<body>
<div class="wrap">
  <section id="loginPanel" class="panel login">
    <p class="eyebrow">WAG1 / ADMIN</p>
    <h1>Anonim İstekler</h1>
    <p class="muted">Yönetim paneline giriş yap.</p>
    <form id="loginForm" novalidate>
      <label class="field"><span>İSİM</span><input id="username" autocomplete="username" required></label>
      <label class="field"><span>ŞİFRE</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button id="loginBtn" class="btn primary" type="submit">GİRİŞ YAP</button>
    </form>
    <div id="loginStatus" class="status" aria-live="polite"></div>
  </section>

  <section id="appPanel" class="hidden">
    <header class="topbar">
      <div class="title-wrap"><p class="eyebrow">WAG1 / ADMIN</p><h1>Anonim İstekler</h1><p class="muted">Gönderilen istekleri yönet.</p></div>
      <div class="actions"><button id="refreshBtn" class="btn ghost" type="button">YENİLE</button><button id="logoutBtn" class="btn ghost" type="button">ÇIKIŞ</button></div>
    </header>

    <div id="stats" class="stats hidden">
      <div class="stat"><div class="stat-label">TOPLAM</div><div id="totalStat" class="stat-value">0</div></div>
      <div class="stat"><div class="stat-label">YENİ</div><div id="newStat" class="stat-value">0</div></div>
      <div class="stat"><div class="stat-label">OKUNDU</div><div id="readStat" class="stat-value">0</div></div>
    </div>

    <div id="appStatus" class="status" aria-live="polite"></div>
    <div id="list" class="list"></div>
  </section>
</div>
<script>
  const $=id=>document.getElementById(id);let token=localStorage.getItem('wag1_admin_token')||'';let rows=[];
  const loginPanel=$('loginPanel'),appPanel=$('appPanel'),list=$('list'),stats=$('stats'),loginBtn=$('loginBtn');
  const setStatus=(el,t,k='')=>{el.textContent=t;el.className='status'+(k?' '+k:'')};
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function loggedIn(){loginPanel.classList.add('hidden');appPanel.classList.remove('hidden');loadRequests()}
  function loggedOut(){appPanel.classList.add('hidden');loginPanel.classList.remove('hidden');$('password').value='';}
  $('loginForm').addEventListener('submit',e=>{e.preventDefault();if(!$('username').value||!$('password').value)return;loginBtn.disabled=true;setStatus($('loginStatus'),'Giriş kontrol ediliyor...','ok');google.script.run.withSuccessHandler(r=>{loginBtn.disabled=false;if(!r||!r.ok){setStatus($('loginStatus'),r?.message||'Giriş başarısız.','err');return}token=r.token;localStorage.setItem('wag1_admin_token',token);setStatus($('loginStatus'),'','');loggedIn()}).withFailureHandler(()=>{loginBtn.disabled=false;setStatus($('loginStatus'),'Sunucuya bağlanılamadı.','err')}).login($('username').value,$('password').value)});
  $('logoutBtn').addEventListener('click',()=>{google.script.run.withSuccessHandler(()=>{localStorage.removeItem('wag1_admin_token');token='';loggedOut()}).logout(token)});
  $('refreshBtn').addEventListener('click',loadRequests);
  function loadRequests(){if(!token)return;setStatus($('appStatus'),'İstekler yükleniyor...','ok');list.innerHTML='<div class="loading">İstekler yükleniyor…</div>';google.script.run.withSuccessHandler(r=>{rows=Array.isArray(r)?r:[];render(rows);$('appStatus').textContent='';$('appStatus').className='status'}).withFailureHandler(()=>{localStorage.removeItem('wag1_admin_token');token='';loggedOut();setStatus($('loginStatus'),'Oturum süresi dolmuş. Tekrar giriş yap.','err')}).getRequests(token)}
  function render(data){stats.classList.remove('hidden');const total=data.length,newCount=data.filter(x=>x.status!=='Okundu').length; $('totalStat').textContent=total;$('newStat').textContent=newCount;$('readStat').textContent=total-newCount;if(!total){list.innerHTML='<div class="empty"><strong>Henüz istek yok.</strong><div style="margin-top:6px">Öğrenciler gönderim yaptığında burada görünecek.</div></div>';return}list.innerHTML=data.map(r=>{const read=r.status==='Okundu';return `<article class="item ${read?'read':''}" data-id="${esc(r.id)}"><div class="item-top"><div class="left-meta"><span class="class">${esc(r.className||'Sınıf yok')}</span><span class="pill ${read?'read':'new'}">${read?'OKUNDU':'YENİ'}</span></div><span class="time">${esc(r.createdAt)}</span></div><div class="message">${esc(r.message)}</div><div class="item-actions">${read?'':`<button class="btn ghost" data-action="read">✓ OKUNDU</button>`}<button class="btn danger" data-action="delete">SİL</button></div></article>`}).join('')}
  list.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const item=btn.closest('.item');const id=item?.dataset.id;if(!id)return;if(btn.dataset.action==='read')markRead(id,btn);else if(btn.dataset.action==='delete')removeRequest(id,btn)});
  function markRead(id,btn){btn.disabled=true;google.script.run.withSuccessHandler(()=>{const r=rows.find(x=>x.id===id);if(r)r.status='Okundu';render(rows)}).withFailureHandler(()=>{btn.disabled=false;setStatus($('appStatus'),'İşlem başarısız.','err')}).markRead(token,id)}
  function removeRequest(id,btn){if(!confirm('Bu isteği silmek istediğine emin misin?'))return;btn.disabled=true;google.script.run.withSuccessHandler(()=>{rows=rows.filter(x=>x.id!==id);render(rows)}).withFailureHandler(()=>{btn.disabled=false;setStatus($('appStatus'),'Silme işlemi başarısız.','err')}).deleteRequest(token,id)}
  if(token)loggedIn();
</script>
</body>
</html>
