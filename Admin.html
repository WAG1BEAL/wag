<!doctype html>
<html lang="tr">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAG1 / Admin</title>
  <style>
    :root{color-scheme:dark;--bg:#080808;--panel:#111;--panel2:#151515;--gold:#f4b727;--line:#292929;--muted:#9a9a9a;--red:#e95a5a;}
    *{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 50% -20%,#1b1608,transparent 44%),var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}main{max-width:1080px;margin:0 auto}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.22em;margin:0 0 8px}h1{font-size:clamp(30px,6vw,48px);margin:0;letter-spacing:-.04em}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.panel{background:rgba(17,17,17,.92);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.28)}.login{max-width:560px;margin:7vh auto}.field{display:block;margin:14px 0}.field span{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #343434;border-radius:12px;background:#0b0b0b;color:#fff;outline:none}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,183,39,.1)}button{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{width:100%;background:linear-gradient(135deg,#ffd35d,#f4ad12);color:#111}.ghost{background:#171717;color:#fff;border:1px solid #303030}.danger{background:rgba(233,90,90,.12);color:#ff9a9a;border:1px solid rgba(233,90,90,.35)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 0}.list{display:grid;gap:12px}.item{padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--panel2)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.meta{color:var(--gold);font-size:12px;font-weight:800}.time{color:#777;font-size:11px}.msg{white-space:pre-wrap;line-height:1.55;margin:10px 0 14px;color:#f0f0f0}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:22px;margin:10px 0;color:var(--muted)}.ok{color:#77e3a6!important}.err{color:#ff9393!important}.hidden{display:none}.pill{font-size:10px;font-weight:800;padding:6px 8px;border-radius:999px;border:1px solid #363636;color:#bbb}.pill.new{color:var(--gold);border-color:rgba(244,183,39,.35)}.pill.read{color:#77e3a6;border-color:rgba(119,227,166,.35)}@media(max-width:640px){body{padding:14px}.panel{padding:16px}.toolbar{align-items:flex-start}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main>
  <section id="loginPanel" class="panel login">
    <p class="eyebrow">WAG1 / ADMIN</p>
    <h1>Anonim İstekler</h1>
    <p class="muted">Yönetim paneline giriş yap.</p>
    <form id="loginForm">
      <label class="field"><span>İSİM</span><input id="username" autocomplete="username" required></label>
      <label class="field"><span>ŞİFRE</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">GİRİŞ YAP</button>
    </form>
    <div id="loginStatus" class="status"></div>
  </section>

  <section id="appPanel" class="hidden">
    <div class="toolbar">
      <div><p class="eyebrow">WAG1 / ADMIN</p><h1>Anonim İstekler</h1><p class="muted">Gönderilen istekler burada görünür.</p></div>
      <button id="logoutBtn" class="ghost">ÇIKIŞ</button>
    </div>
    <div id="appStatus" class="status"></div>
    <div id="list" class="list"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem('wag1_admin_token') || '';
  const loginPanel = $('loginPanel');
  const appPanel = $('appPanel');
  const list = $('list');

  function showStatus(el, text, good=false){ el.textContent=text; el.className='status ' + (good?'ok':'err'); }
  function esc(s){ return String(s??'').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function setLoggedIn(){ loginPanel.classList.add('hidden'); appPanel.classList.remove('hidden'); loadRequests(); }
  function setLoggedOut(){ appPanel.classList.add('hidden'); loginPanel.classList.remove('hidden'); }

  $('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    showStatus($('loginStatus'),'Giriş kontrol ediliyor...',true);
    google.script.run.withSuccessHandler(res => {
      if(!res || !res.ok){ showStatus($('loginStatus'), res?.message || 'Giriş başarısız.'); return; }
      token = res.token; localStorage.setItem('wag1_admin_token', token); setLoggedIn();
    }).withFailureHandler(() => showStatus($('loginStatus'),'Sunucuya bağlanılamadı.')).login($('username').value, $('password').value);
  });

  $('logoutBtn').addEventListener('click', () => {
    google.script.run.withSuccessHandler(() => { localStorage.removeItem('wag1_admin_token'); token=''; setLoggedOut(); }).logout(token);
  });

  function loadRequests(){
    showStatus($('appStatus'),'İstekler yükleniyor...',true);
    google.script.run.withSuccessHandler(rows => { render(rows || []); $('appStatus').textContent=''; $('appStatus').className='status'; })
      .withFailureHandler(err => { localStorage.removeItem('wag1_admin_token'); token=''; setLoggedOut(); showStatus($('loginStatus'),'Oturum süresi dolmuş. Tekrar giriş yap.'); })
      .getRequests(token);
  }

  function render(rows){
    if(!rows.length){ list.innerHTML='<div class="panel"><strong>Henüz istek yok.</strong><div class="muted" style="margin-top:6px">Öğrenciler gönderim yaptığında burada görünür.</div></div>'; return; }
    list.innerHTML=rows.map(r => `
      <article class="item">
        <div class="top"><div><span class="meta">${esc(r.className || 'Sınıf yok')}</span> <span class="pill ${r.status==='Okundu'?'read':'new'}">${esc(r.status)}</span></div><span class="time">${esc(r.createdAt)}</span></div>
        <div class="msg">${esc(r.message)}</div>
        <div class="actions">
          ${r.status!=='Okundu'?`<button class="ghost" data-read="${esc(r.id)}">✓ OKUNDU</button>`:''}
          <button class="danger" data-delete="${esc(r.id)}">SİL</button>
        </div>
      </article>`).join('');
    list.querySelectorAll('[data-read]').forEach(btn => btn.addEventListener('click', () => markRead(btn.dataset.read)));
    list.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => remove(btn.dataset.delete)));
  }
  function markRead(id){ google.script.run.withSuccessHandler(()=>loadRequests()).withFailureHandler(()=>showStatus($('appStatus'),'İşlem başarısız.')).markRead(token,id); }
  function remove(id){ if(!confirm('Bu isteği silmek istediğine emin misin?')) return; google.script.run.withSuccessHandler(()=>loadRequests()).withFailureHandler(()=>showStatus($('appStatus'),'Silme işlemi başarısız.')).deleteRequest(token,id); }

  if(token){ setLoggedIn(); }
</script>
</body>
</html>
