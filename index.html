<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAG1 — İstekleriniz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gold-dust"></div>
  <div class="fog fog-one" aria-hidden="true"></div>
  <div class="fog fog-two" aria-hidden="true"></div>

  <header class="hero">
    <img src="wag1-logo.webp" alt="WAG1 logosu" class="logo">
    <div class="hero-copy">
      <p class="eyebrow">WAG1</p>
      <h1>İstekleriniz</h1>
      <p>Yazdığınız istekleriniz detaylıca okuyup herkes ile ilgilenmeye çalışacağız.</p>
    </div>
  </header>

  <main>
    <section class="request-card">
      <div class="card-head">
        <h2>İSTEĞİNİ İLET</h2>
      </div>

      <form id="requestForm">
        <label for="className">Sınıfınız</label>
        <input id="className" name="className" type="text"
               placeholder="buraya yazınız" maxlength="30" required>

        <label for="request">İsteğiniz</label>
        <textarea id="request" name="request" rows="6"
                  placeholder="Ne istediğinizi buraya yazın..." maxlength="1000" required></textarea>

        <button type="submit">
          <span>İSTEĞİ GÖNDER</span>
          <span class="arrow">→</span>
        </button>

        <p class="status" id="status" aria-live="polite"></p>
      </form>
    </section>

    <button class="about-toggle" id="aboutToggle" type="button"
            aria-expanded="false" aria-controls="aboutPanel">
      <span>HAKKIMIZDA</span>
      <span class="about-arrow">↓</span>
    </button>

    <section class="about-card" id="aboutPanel" aria-hidden="true">
      <img src="wag1-hakkimizda.webp" alt="WAG1 kaptanlar ve staff bilgileri"
           loading="lazy" decoding="async">
    </section>

    <section class="hands">
      <img src="wag1-hands.webp" alt="WAG1 el tasarımı" loading="lazy" decoding="async">
    </section>
  </main>

  <div class="honeypot-zone" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;">
    <input id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <iframe id="submitFrame" name="submitFrame" title="Form gönderim alanı" style="position:absolute;left:-9999px;width:1px;height:1px;border:0;opacity:0;pointer-events:none;"></iframe>
  <form id="backendForm" method="POST" target="submitFrame" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;">
    <input type="hidden" name="action" value="submit">
    <input type="hidden" name="className" id="backendClass">
    <input type="hidden" name="request" id="backendRequest">
    <input type="hidden" name="website" id="backendWebsite">
  </form>

  <footer>
    <span>WAG1</span>
    <span>•</span>
    <span>İstek Sistemi</span>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
