<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WAG1 anonim istek sistemi.">
  <title>WAG1 — Anonim İstekler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gold-dust" aria-hidden="true"></div>
  <div class="fog fog-one" aria-hidden="true"></div>
  <div class="fog fog-two" aria-hidden="true"></div>

  <header class="hero">
    <img src="wag1-logo.webp" alt="WAG1 logosu" class="logo">
    <div class="hero-copy">
      <p class="eyebrow">WAG1</p>
      <h1>İstekleriniz</h1>
      <p>Yazdığınız istekleriniz detaylıca okuyup herkes ile ilgilenmeye çalışacağız.</p>
    </div>
  </header>

  <main>
    <section class="request-card">
      <div class="card-head">
        <h2>İSTEĞİNİ İLET</h2>
      </div>

      <form id="requestForm" autocomplete="off">
        <label for="className">Sınıfınız</label>
        <input id="className" name="className" type="text"
               placeholder="Ornek (12B)" maxlength="30" required>

        <label for="request">İsteğiniz</label>
        <textarea id="request" name="request" rows="6"
                  placeholder="vaatlerimiz dışında isteklerinizi belirtiniz" maxlength="1000" required></textarea>

        <!-- Honeypot: normal kullanıcı bunu görmez; botların çoğunu ayıklamak için. -->
        <input class="hp" id="website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" id="submitButton">
          <span>ANONİM OLARAK GÖNDER</span>
          <span class="arrow">→</span>
        </button>

        <p class="status" id="status" aria-live="polite"></p>
      </form>
</section>

    <button class="about-toggle" id="aboutToggle" type="button"
            aria-expanded="false" aria-controls="aboutPanel">
      <span>HAKKIMIZDA</span>
      <span class="about-arrow">↓</span>
    </button>

    <section class="about-card" id="aboutPanel" aria-hidden="true">
      <img src="wag1-hakkimizda.webp" alt="WAG1 kaptanlar ve staff bilgileri"
           loading="lazy" decoding="async">
    </section>

    <section class="hands">
      <img src="wag1-hands.webp" alt="WAG1 el tasarımı" loading="lazy" decoding="async">
    </section>
  </main>

  <footer>
    <span>WAG1</span>
    <span>•</span>
    <span>Anonim İstek Sistemi</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
