<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>WAG1 — Modern Deneme</title>
  <meta name="description" content="WAG1 anonim istek sistemi — modern deneme sürümü.">
  <style>
    :root{
      --bg:#050505;
      --panel:#0b0b0d;
      --panel-2:#0f0f12;
      --gold:#f6c13a;
      --gold-2:#ffd86a;
      --white:#f5f5f7;
      --muted:#9a9aa2;
      --line:rgba(246,193,58,.18);
      --line-soft:rgba(255,255,255,.08);
      --shadow:0 28px 90px rgba(0,0,0,.5);
      --radius:24px;
    }
    /* --- WAG1 VISIBLE ATMOSPHERIC FOG --- */
    .fog-scene{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      overflow:hidden;
      opacity:1;
    }
    .fog-layer{
      position:absolute;
      width:78vw;
      height:34vw;
      max-width:1200px;
      max-height:560px;
      min-width:500px;
      min-height:240px;
      border-radius:50%;
      filter:blur(34px);
      mix-blend-mode:screen;
      transform-origin:center;
      background:
        radial-gradient(ellipse at center,
          rgba(255,255,255,.15) 0%,
          rgba(255,255,255,.085) 24%,
          rgba(246,193,58,.065) 43%,
          rgba(255,255,255,.028) 58%,
          transparent 77%);
    }
    .fog-a{left:-25%; top:10%; opacity:.34; animation:fogDriftA 17s ease-in-out infinite alternate}
    .fog-b{right:-27%; top:25%; opacity:.27; animation:fogDriftB 22s ease-in-out infinite alternate}
    .fog-c{left:5%; bottom:12%; opacity:.22; animation:fogDriftC 25s ease-in-out infinite alternate}
    .fog-d{right:-3%; bottom:3%; opacity:.18; animation:fogDriftD 20s ease-in-out infinite alternate}
    .fog-vignette{
      position:absolute; inset:-10%;
      background:
        radial-gradient(circle at 50% 44%, transparent 28%, rgba(0,0,0,.08) 55%, rgba(0,0,0,.48) 100%);
    }
    @keyframes fogDriftA{
      0%{transform:translate3d(-6vw,0,0) scale(.96) rotate(-7deg)}
      100%{transform:translate3d(38vw,6vh,0) scale(1.28) rotate(8deg)}
    }
    @keyframes fogDriftB{
      0%{transform:translate3d(15vw,-3vh,0) scale(.92) rotate(8deg)}
      100%{transform:translate3d(-34vw,8vh,0) scale(1.34) rotate(-9deg)}
    }
    @keyframes fogDriftC{
      0%{transform:translate3d(-12vw,4vh,0) scale(1.02) rotate(4deg)}
      100%{transform:translate3d(27vw,-10vh,0) scale(1.4) rotate(-5deg)}
    }
    @keyframes fogDriftD{
      0%{transform:translate3d(10vw,1vh,0) scale(.9) rotate(-4deg)}
      100%{transform:translate3d(-21vw,-9vh,0) scale(1.3) rotate(5deg)}
    }

    /* Content stays above the fog. */
main, footer{position:relative;z-index:1}

    @media (max-width:700px){
      .fog-layer{
        min-width:400px;
        min-height:185px;
        filter:blur(25px);
      }
      .fog-a{opacity:.25}
      .fog-b{opacity:.20}
      .fog-c{opacity:.15}
      .fog-d{opacity:.12}
    }



    @media (prefers-reduced-motion:reduce){
      .fog-layer{animation:none!important}
    }
*{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(246,193,58,.11), transparent 30%),
        radial-gradient(circle at 15% 35%, rgba(246,193,58,.055), transparent 24%),
        radial-gradient(circle at 88% 70%, rgba(246,193,58,.035), transparent 28%),
        var(--bg);
      color:var(--white);
      font-family:Inter,Montserrat,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none; z-index:-2;
      opacity:.26;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,.10) 1px, transparent 1.5px);
      background-size:34px 34px;
      mask-image:linear-gradient(to bottom, #000, transparent 80%);
    }

    .ambient{
      position:fixed; inset:-10%;
      pointer-events:none; z-index:-1;
      filter:blur(40px);
      opacity:.45;
    }
    .orb{position:absolute; width:28rem; height:28rem; border-radius:50%;
      background:radial-gradient(circle, rgba(246,193,58,.16), transparent 67%);
      animation:float 12s ease-in-out infinite;
    }
    .orb.one{top:4%; left:24%}
    .orb.two{right:8%; top:36%; animation-delay:-4s; transform:scale(.72)}
    .orb.three{left:-8%; bottom:-8%; animation-delay:-7s; transform:scale(.62)}

    @keyframes float{
      0%,100%{transform:translate3d(0,0,0)}
      50%{transform:translate3d(0,-22px,0)}
    }
main{width:min(980px,100%); margin:auto; padding:34px 18px 80px}

    .hero{
      min-height:72vh;
      display:grid;
      place-items:center;
      text-align:center;
      position:relative;
    }
    .hero-inner{max-width:800px; transform:translateY(-20px)}
    .logo{
      width:min(500px,208vw);
      display:block;
      margin:0 auto 30px;
      filter:drop-shadow(0 14px 35px rgba(246,193,58,.18));
      animation:logoIn .9s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes logoIn{
      from{opacity:0; transform:translateY(18px) scale(.96)}
      to{opacity:1; transform:none}
    }
    .eyebrow{
      margin:0 0 10px;
      color:var(--gold);
      font-size:.72rem; font-weight:900; letter-spacing:.34em;
    }
    h1{
      margin:0;
      font-size:clamp(3.1rem,8vw,6.2rem);
      line-height:.92;
      letter-spacing:-.06em;
      text-transform:uppercase;
      font-weight:900;
    }
    .hero p{
      max-width:650px;
      margin:22px auto 0;
      color:var(--muted);
      font-size:clamp(.92rem,1.7vw,1.08rem);
      line-height:1.7;
    }
    .hero-cta{
      display:inline-flex; align-items:center; gap:9px;
      margin-top:28px;
      padding:13px 18px;
      border-radius:14px;
      color:#15110a; background:var(--gold);
      text-decoration:none; font-weight:900; font-size:.82rem; letter-spacing:.04em;
      box-shadow:0 14px 30px rgba(246,193,58,.18);
      transition:.25s ease;
    }
    .hero-cta:hover{transform:translateY(-3px); box-shadow:0 18px 34px rgba(246,193,58,.26)}
    .scroll-hint{margin-top:18px; color:#66666d; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase}

    .section{
      margin-top:32px;
      opacity:0; transform:translateY(28px);
      transition:opacity .65s ease, transform .65s ease;
    }
    .section.show{opacity:1; transform:none}

    .request-shell{
      position:relative;
      padding:1px;
      border-radius:28px;
      background:linear-gradient(125deg, rgba(246,193,58,.75), rgba(246,193,58,.05) 38%, rgba(255,255,255,.06) 72%, rgba(246,193,58,.38));
      box-shadow:var(--shadow);
    }
    .request-card{
      border-radius:27px;
      background:
        radial-gradient(circle at 100% 0, rgba(246,193,58,.10), transparent 24%),
        linear-gradient(180deg,#0b0b0d,#070708);
      padding:clamp(22px,4vw,38px);
      overflow:hidden;
      position:relative;
    }
    .request-card::after{
      content:"";
      position:absolute; inset:auto -20% -70% -20%;
      height:300px;
      background:radial-gradient(circle, rgba(246,193,58,.08), transparent 68%);
      pointer-events:none;
    }

    .card-top{
      display:flex; justify-content:space-between; gap:18px; align-items:flex-end;
      margin-bottom:26px;
    }
    .card-kicker{color:var(--gold); font-size:.68rem; font-weight:900; letter-spacing:.18em}
    .card-title{margin:4px 0 0; font-size:clamp(1.55rem,3.4vw,2.3rem); letter-spacing:-.04em}
    .secure{color:#6f6f76; font-size:.68rem; letter-spacing:.05em; text-align:right}

    form{position:relative; z-index:1}
    .field{margin-bottom:18px}
    label{display:block; margin:0 0 8px; color:#b2b2b8; font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.12em}
    input,textarea{
      width:100%; border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.025);
      color:var(--white);
      border-radius:15px;
      padding:14px 15px;
      outline:none; font:inherit;
      transition:border-color .2s ease, box-shadow .2s ease, background .2s ease, transform .2s ease;
    }
    textarea{min-height:150px; resize:vertical; line-height:1.55}
    input::placeholder,textarea::placeholder{color:#5e5e65}
    input:focus,textarea:focus{
      border-color:rgba(246,193,58,.5);
      background:rgba(246,193,58,.025);
      box-shadow:0 0 0 4px rgba(246,193,58,.07);
      transform:translateY(-1px);
    }

    .submit{
      width:100%; border:0; cursor:pointer;
      border-radius:15px; padding:15px 18px;
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(90deg,#f5bb2f,#ffd45c);
      color:#17120a; font-weight:950; letter-spacing:.08em;
      box-shadow:0 12px 26px rgba(246,193,58,.15);
      transition:.25s ease;
      position:relative; overflow:hidden;
    }
    .submit::before{
      content:""; position:absolute; top:0; bottom:0; left:-45%; width:34%;
      transform:skewX(-20deg);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
      transition:left .6s ease;
    }
    .submit:hover{transform:translateY(-2px); box-shadow:0 16px 32px rgba(246,193,58,.22)}
    .submit:hover::before{left:120%}
    .submit:active{transform:translateY(0)}
    .submit .arrow{font-size:1.1rem}

    .status{min-height:24px; margin:12px 2px 0; font-size:.78rem; color:#9d9da4}
    .status.ok{color:#6ed69a}
    .status.err{color:#ff8585}

    .about{
      margin-top:16px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:18px;
      background:rgba(255,255,255,.018);
      overflow:hidden;
    }
    .about-btn{
      width:100%; background:none; border:0; color:var(--white); cursor:pointer;
      padding:17px 18px; display:flex; align-items:center; justify-content:space-between;
      font:inherit; font-size:.73rem; font-weight:900; letter-spacing:.12em;
    }
    .about-btn span:last-child{color:var(--gold); transition:transform .25s ease}
    .about.open .about-btn span:last-child{transform:rotate(180deg)}
    .about-panel{max-height:0; overflow:hidden; transition:max-height .55s ease}
    .about-panel img{display:block; width:100%; height:auto; opacity:.94}
    .about.open .about-panel{max-height:1200px}

    .hands{
      margin-top:46px;
      text-align:center;
      overflow:hidden;
    }
    .hands img{
      width:min(560px,72%);
      display:block; margin:auto;
      filter:drop-shadow(0 28px 55px rgba(246,193,58,.12));
      transform:translateY(30px);
      opacity:.88;
      transition:transform 1s ease, opacity 1s ease;
    }
    .hands.show img{transform:none; opacity:1}

    footer{
      padding:0 18px 34px;
      text-align:center;
      color:#515159; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
    }

    @media (max-width:700px){
.nav{padding:10px 10px 10px 12px}
      main{padding:34px 12px 58px}
      .hero{min-height:66vh}
      .hero-inner{transform:none}
      .logo{width:min(240px,64vw); margin-bottom:22px}
      .request-card{padding:20px}
      .card-top{align-items:flex-start; flex-direction:column}
      .secure{text-align:left}
      input,textarea{font-size:16px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important}
    }
  </style>
</head>
<body>

  <div class="fog-scene" aria-hidden="true">
    <div class="fog-layer fog-a"></div>
    <div class="fog-layer fog-b"></div>
    <div class="fog-layer fog-c"></div>
    <div class="fog-layer fog-d"></div>
    <div class="fog-vignette"></div>
  </div>
  <div class="ambient" aria-hidden="true">
    <div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
  </div>
  <main>
    <section class="hero">
      <div class="hero-inner">
        <img class="logo" src="wag1-logo.png" alt="WAG1 logosu">
        <p class="eyebrow">WAG1</p>
        <h1>İstekleriniz</h1>
        <p>Yazdığınız istekleri anonim olarak bize ulaştırın. Gelen her öneriyi okuyup değerlendirmeye çalışıyoruz.</p>
        <a class="hero-cta" href="#istek"><span>İSTEĞİNİ İLET</span><span>↓</span></a>
        <div class="scroll-hint">Aşağı kaydır</div>
      </div>
    </section>

    <section class="section" id="istek">
      <div class="request-shell">
        <div class="request-card">
          <div class="card-top">
            <div>
              <div class="card-kicker">WAG1</div>
              <h2 class="card-title">İsteğini ilet</h2>
            </div>
            <div class="secure">İsmin görünmez · anonim gönderim</div>
          </div>

          <form id="requestForm" autocomplete="off">
            <div class="field">
              <label for="className">Sınıfınız</label>
              <input id="className" type="text" maxlength="30" placeholder="Örnek (12B)" required>
            </div>

            <div class="field">
              <label for="request">İsteğiniz</label>
              <textarea id="request" maxlength="1000" placeholder="Vaatlerimiz dışında isteklerinizi belirtiniz" required></textarea>
            </div>

            <button class="submit" id="submitButton" type="submit">
              <span>ANONİM OLARAK GÖNDER</span>
              <span class="arrow">→</span>
            </button>
            <div class="status" id="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>

    <section class="section" style="margin-top:16px">
      <div class="about" id="about">
        <button class="about-btn" id="aboutToggle" type="button" aria-expanded="false">
          <span>HAKKIMIZDA</span><span>↓</span>
        </button>
        <div class="about-panel" id="aboutPanel" aria-hidden="true">
          <img src="https://wag1beal.github.io/wag/wag1-hakkimizda.webp" alt="WAG1 kaptanlar ve staff bilgileri" loading="lazy">
        </div>
      </div>
    </section>

    <section class="hands section" aria-label="WAG1 tasarımı">
      <img src="https://wag1beal.github.io/wag/wag1-hands.webp" alt="WAG1 el tasarımı" loading="lazy">
    </section>
  </main>

  <footer>WAG1 · BEAL</footer>

  <iframe id="submitFrame" name="submitFrame" title="Form gönderim alanı" style="display:none;width:0;height:0;border:0"></iframe>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby9VZy_ub6y_59ZLyahTguNq2rBTmVuWW6Al8ZJy3slvFL8x7aXxwhlQ275aONTXbs2Aw/exec";

    const form = document.getElementById("requestForm");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitButton");
    const about = document.getElementById("about");
    const aboutToggle = document.getElementById("aboutToggle");
    const aboutPanel = document.getElementById("aboutPanel");

    aboutToggle.addEventListener("click", () => {
      const open = !about.classList.contains("open");
      about.classList.toggle("open", open);
      aboutToggle.setAttribute("aria-expanded", String(open));
      aboutPanel.setAttribute("aria-hidden", String(!open));
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting) entry.target.classList.add("show");
      });
    }, {threshold:.14});
    document.querySelectorAll(".section").forEach(el => observer.observe(el));
    document.querySelector(".hands")?.classList.remove("show");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const className = document.getElementById("className").value.trim();
      const request = document.getElementById("request").value.trim();

      if(!className || !request){
        statusEl.textContent = "Lütfen iki alanı da doldur.";
        statusEl.className = "status err";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.style.opacity = ".7";
      statusEl.textContent = "Gönderiliyor…";
      statusEl.className = "status";

      const tempForm = document.createElement("form");
      tempForm.method = "POST";
      tempForm.action = GAS_URL;
      tempForm.target = "submitFrame";
      tempForm.style.display = "none";

      const add = (name, value) => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = value;
        tempForm.appendChild(input);
      };

      add("action", "submit");
      add("className", className);
      add("request", request);
      add("website", "");

      document.body.appendChild(tempForm);
      tempForm.submit();
      tempForm.remove();

      setTimeout(() => {
        form.reset();
        statusEl.textContent = "İsteğin anonim olarak gönderildi ✓";
        statusEl.className = "status ok";
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";
      }, 900);
    });
  </script>
</body>
</html>
